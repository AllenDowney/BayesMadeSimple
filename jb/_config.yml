# Book settings
title: Bayesian Statistics Made Simple
author: Allen B. Downey

execute:
  # build.sh runs the notebooks with nbmake first; this runs them again for the outputs
  execute_notebooks: force
  timeout: 300

repository:
  url: https://github.com/AllenDowney/BayesMadeSimple
  branch: master

html:
  baseurl: https://allendowney.github.io/BayesMadeSimple/
  use_repository_button: true
  # Page-view counter: one request per page view to greenteapress.com/gh.gif,
  # counted from the greenteapress.com access logs (GreenTeaPress scripts/log_report.py).
  # No cookies, no third party.
  extra_footer: |
    <script>new Image().src="https://greenteapress.com/gh.gif?u="+encodeURIComponent(location.href)+"&r="+encodeURIComponent(document.referrer)</script>

parse:
  myst_enable_extensions:
    - amsmath
    - dollarmath

sphinx:
  extra_extensions:
    - sphinx_sitemap
    - sphinxext.opengraph
  config:
    html_baseurl: https://allendowney.github.io/BayesMadeSimple/
    sitemap_url_scheme: "{link}"
    sitemap_excludes: [genindex.html, search.html]
    ogp_site_url: https://allendowney.github.io/BayesMadeSimple/
    ogp_site_name: Bayesian Statistics Made Simple
    ogp_image: https://greenteapress.com/wp/wp-content/uploads/2021/04/think_bayes_2e_cover_small.jpg
    ogp_image_alt: Cover of Think Bayes by Allen B. Downey, the book this tutorial is based on
    # the opening text is often boilerplate, so write meta descriptions per page instead
    ogp_enable_meta_description: false
